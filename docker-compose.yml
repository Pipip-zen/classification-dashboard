services:
  tactical-gcs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tactical-gcs
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NO_BROWSER=1
      - OPERATOR_PIN=${OPERATOR_PIN:-1234}
      - AUTH_SECRET=${AUTH_SECRET:-vanguard-tactical-gcs-dev-secret-change-me}
      - DRONE_USERNAME=${DRONE_USERNAME:-drone}
      - DRONE_PASSWORD=${DRONE_PASSWORD:-drone123}
      - ROV_USERNAME=${ROV_USERNAME:-rov}
      - ROV_PASSWORD=${ROV_PASSWORD:-rov123}
      - SPECTATOR_USERNAME=${SPECTATOR_USERNAME:-spectator}
      - SPECTATOR_PASSWORD=${SPECTATOR_PASSWORD:-spectator123}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Cloudflare Tunnel Service (Zero-Port, Auto-SSL HTTPS & DDoS Protected)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tactical-gcs-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      tactical-gcs:
        condition: service_healthy
    profiles: ["tunnel"]
