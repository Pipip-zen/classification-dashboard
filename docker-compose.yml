services:
  tactical-gcs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tactical-gcs
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NO_BROWSER=1
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
