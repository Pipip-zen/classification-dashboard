services:
  tactical-gcs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tactical-gcs
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - NO_BROWSER=1
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: tactical-gcs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      tactical-gcs:
        condition: service_healthy
